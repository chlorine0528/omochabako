<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#bfe0ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>おはなばたけ</title>
<style>
  :root{ color-scheme: light; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    width:100%; height:100%; height:100dvh; overflow:hidden;
    background:#dcecdf;
    overscroll-behavior:none; touch-action:none;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
    font-family: system-ui, -apple-system, "Segoe UI",
      "Hiragino Kaku Gothic ProN", "Hiragino Sans",
      "BIZ UDPGothic", "Yu Gothic Medium", "Yu Gothic", YuGothic,
      Meiryo, "Noto Sans JP", sans-serif;
  }
  #c{ position:fixed; inset:0; width:100%; height:100%; display:block; }
  #home{
    position:fixed; top:max(10px, env(safe-area-inset-top)); left:max(10px, env(safe-area-inset-left));
    width:40px; height:40px; padding:0; border:0; border-radius:50%;
    background:rgba(255,255,255,.42); backdrop-filter:blur(2px);
    display:grid; place-items:center; cursor:pointer; z-index:5;
    touch-action:none; -webkit-tap-highlight-color:transparent;
  }
  #home svg{ width:34px; height:34px; display:block; }
  #home .trk{ fill:none; stroke:rgba(74,92,96,.22); stroke-width:2.5; }
  #home .rng{
    fill:none; stroke:#4a5c60; stroke-width:2.5; stroke-linecap:round;
    stroke-dasharray:94.2; stroke-dashoffset:94.2;
    transform:rotate(-90deg); transform-origin:50% 50%;
    transition:stroke-dashoffset .04s linear;
  }
  #home.hold .rng{ stroke-dashoffset:0; transition:stroke-dashoffset .7s linear; }
  #home .ico{ fill:#4a5c60; opacity:.72; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="home" aria-label="おもちゃばこに もどる">
  <svg viewBox="0 0 36 36" aria-hidden="true">
    <circle class="trk" cx="18" cy="18" r="15"/>
    <circle class="rng" cx="18" cy="18" r="15"/>
    <path class="ico" d="M18 9.4 10.2 16v9.1c0 .6.5 1.1 1.1 1.1h4.1v-5.3h5.2v5.3h4.1c.6 0 1.1-.5 1.1-1.1V16z"/>
  </svg>
</button>
<script>
(function(){
'use strict';

/* ---------- 画面 ---------- */
var c = document.getElementById('c'), ctx = c.getContext('2d');
var W = 0, H = 0, DPR = 1, HZ = 0, SKY = null, FIELD = null, BLADES = [], HILLS = [];

// 位置を固定したいものだけに使う、種つきの擬似乱数
function rnd(seed){
  var s = Math.sin(seed * 127.1 + 311.7) * 43758.5453;
  return s - Math.floor(s);
}

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  var r = c.getBoundingClientRect();
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  c.width = Math.round(W * DPR); c.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  HZ = H * (W > H ? 0.34 : 0.42);

  SKY = ctx.createLinearGradient(0, 0, 0, HZ);
  SKY.addColorStop(0,    '#a9d8e8');
  SKY.addColorStop(0.55, '#cfe7e2');
  SKY.addColorStop(1,    '#f6ecd4');

  FIELD = ctx.createLinearGradient(0, HZ, 0, H);
  FIELD.addColorStop(0,    '#a6d182');
  FIELD.addColorStop(0.45, '#79bd6a');
  FIELD.addColorStop(1,    '#4f9a58');

  // 遠くの丘
  HILLS = [];
  for (var i = 0; i < 3; i++){
    HILLS.push({
      cx: W * (0.16 + 0.34 * i) + rnd(i + 3) * W * 0.12,
      rx: W * (0.30 + rnd(i + 7) * 0.22),
      ry: H * (0.05 + rnd(i + 11) * 0.045),
      col: ['#8cc48f', '#7cba85', '#93cb92'][i]
    });
  }

  // 草の房。毎フレーム揺らすので位置だけ固定する
  BLADES = [];
  var tufts = Math.min(90, Math.round(W * H / 6200));
  for (var j = 0; j < tufts; j++){
    var bx = rnd(j * 1.7 + 0.3) * W;
    var by = HZ + (H - HZ) * Math.pow(rnd(j * 2.9 + 5.1), 0.75);
    var dep = (by - HZ) / Math.max(1, H - HZ);
    var base = (7 + rnd(j * 3.3 + 9) * 9) * (0.45 + 1.05 * dep);
    for (var k = -1; k <= 1; k++){
      BLADES.push({
        x: bx + k * base * 0.34,
        y: by + Math.abs(k) * base * 0.06,
        h: base * (k === 0 ? 1 : 0.68 + rnd(j * 7.1 + k + 4) * 0.2),
        lean: k * (0.34 + rnd(j * 8.3 + k + 6) * 0.2),
        wd: Math.max(1.4, base * 0.13),
        ph: rnd(j * 5.5 + 2) * 6.283,
        col: rnd(j * 4.1 + 1) > 0.55
          ? 'rgba(148,206,132,.5)'
          : 'rgba(46,110,60,.32)'
      });
    }
  }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 120); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
resize();

/* ---------- 音 ---------- */
var ac = null, master = null, noiseBuf = null;
// ペンタトニック。どこを押しても濁らない
var SCALE = [1318.51, 1174.66, 1046.50, 880.00, 783.99, 659.25, 587.33, 523.25];

function audio(){
  if (ac){ if (ac.state === 'suspended') ac.resume(); return ac; }
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  try { ac = new AC(); } catch(e){ return null; }
  var comp = ac.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 22; comp.ratio.value = 9;
  comp.attack.value = 0.003; comp.release.value = 0.22;
  master = ac.createGain(); master.gain.value = 0.5;
  master.connect(comp); comp.connect(ac.destination);
  var n = Math.floor(ac.sampleRate * 0.14);
  noiseBuf = ac.createBuffer(1, n, ac.sampleRate);
  var d = noiseBuf.getChannelData(0);
  for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.4);
  return ac;
}

// 花が咲く音。マリンバ風
function sBloom(f){
  var a = audio(); if (!a) return;
  var t = a.currentTime;
  var o = a.createOscillator(); o.type = 'triangle';
  o.frequency.setValueAtTime(f, t);
  var g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.34, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.46);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.5);

  var o2 = a.createOscillator(); o2.type = 'sine';
  o2.frequency.setValueAtTime(f * 2, t);
  var g2 = a.createGain();
  g2.gain.setValueAtTime(0.0001, t);
  g2.gain.exponentialRampToValueAtTime(0.13, t + 0.006);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
  o2.connect(g2); g2.connect(master); o2.start(t); o2.stop(t + 0.18);

  // 茎が伸びるさらさら音
  var s = a.createBufferSource(); s.buffer = noiseBuf;
  var bp = a.createBiquadFilter(); bp.type = 'bandpass';
  bp.frequency.setValueAtTime(1400, t);
  bp.frequency.exponentialRampToValueAtTime(3600, t + 0.13);
  bp.Q.value = 1.4;
  var gn = a.createGain();
  gn.gain.setValueAtTime(0.0001, t);
  gn.gain.exponentialRampToValueAtTime(0.10, t + 0.03);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.19);
  s.connect(bp); bp.connect(gn); gn.connect(master); s.start(t);
}

// 空を押したときの小鳥
function sChirp(){
  var a = audio(); if (!a) return;
  for (var i = 0; i < 2; i++){
    (function(i){
      var t = a.currentTime + i * 0.085;
      var o = a.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(1500 + i * 320, t);
      o.frequency.exponentialRampToValueAtTime(2450 + i * 360, t + 0.05);
      o.frequency.exponentialRampToValueAtTime(1750 + i * 300, t + 0.1);
      var g = a.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.17, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.15);
    })(i);
  }
}

// たくさん咲いたときのごほうび
function sCheer(){
  var a = audio(); if (!a) return;
  var seq = [523.25, 659.25, 783.99, 1046.50, 1318.51];
  for (var i = 0; i < seq.length; i++){
    (function(i){
      var t = a.currentTime + i * 0.08;
      var o = a.createOscillator(); o.type = 'triangle';
      o.frequency.setValueAtTime(seq[i], t);
      var g = a.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.24, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.65);
    })(i);
  }
}

/* ---------- 生きもの ---------- */
var HUES = [348, 6, 24, 44, 54, 286, 312, 205, 168];
var flowers = [], butters = [], birds = [], sparks = [], puffs = [], clouds = [];
var MAXF = 34, MAXB = 5, bloomed = 0;

function unit(){ return Math.min(W, H); }

function makeFlower(x, y){
  var depth = Math.max(0, Math.min(1, (y - HZ) / Math.max(1, H - HZ)));
  var u = unit();
  var size = u * (0.045 + 0.055 * depth) * (0.85 + Math.random() * 0.3);
  var hue = HUES[Math.floor(Math.random() * HUES.length)];
  return {
    x: x, y: y, depth: depth,
    size: size,
    stem: size * (1.5 + Math.random() * 0.9),
    hue: hue,
    sat: 62 + Math.random() * 24,
    lig: 68 + Math.random() * 12,
    core: (hue > 40 && hue < 70) ? 24 : 46,
    kind: Math.floor(Math.random() * 4),
    petals: 5 + Math.floor(Math.random() * 4),
    ph: Math.random() * 6.283,
    sw: 0.7 + Math.random() * 0.6,
    sc: 0, dying: 0, born: 0
  };
}

function makeButterfly(){
  return {
    x: Math.random() * W,
    y: HZ + Math.random() * (H - HZ) * 0.7,
    tx: Math.random() * W, ty: HZ + Math.random() * (H - HZ) * 0.7,
    vx: 0, vy: 0,
    hue: HUES[Math.floor(Math.random() * HUES.length)],
    flap: Math.random() * 6.283,
    sz: unit() * 0.032 + Math.random() * unit() * 0.014,
    wait: 0
  };
}

function makeBird(x, y){
  var dir = x < W / 2 ? 1 : -1;
  return {
    x: x, y: y, dir: dir,
    sp: 42 + Math.random() * 40,
    ph: Math.random() * 6.283,
    bob: 8 + Math.random() * 10,
    sz: unit() * 0.022 + Math.random() * unit() * 0.01
  };
}

function makeCloud(x, y, s){
  return { x: x, y: y, s: s, sp: 3 + Math.random() * 5 };
}

for (var i = 0; i < 4; i++) butters.push(makeButterfly());
for (var i = 0; i < 4; i++){
  clouds.push(makeCloud(rnd(i * 9 + 2) * W, HZ * (0.14 + rnd(i * 4 + 6) * 0.5), 0.7 + rnd(i * 6 + 3) * 0.8));
}
// 開いた瞬間に何本か咲いている。空っぽの画面を見せない
for (var i = 0; i < 5; i++){
  var f = makeFlower(W * (0.12 + 0.19 * i) + (Math.random() - 0.5) * W * 0.08,
                     HZ + (H - HZ) * (0.25 + Math.random() * 0.6));
  f.sc = 1; flowers.push(f);
}

/* ---------- 入力 ---------- */
function plant(x, y){
  var f = makeFlower(x, y);
  flowers.push(f);
  bloomed++;
  var k = Math.round(f.depth * (SCALE.length - 1));
  sBloom(SCALE[Math.max(0, Math.min(SCALE.length - 1, k))]);
  sparks.push({ x: x, y: y - f.stem * 0.5, r: f.size * 0.5, hue: f.hue, life: 1 });

  // 近くの ちょうちょ が新しい花に寄る
  var best = -1, bd = 1e9;
  for (var i = 0; i < butters.length; i++){
    var b = butters[i];
    var d = (b.x - x) * (b.x - x) + (b.y - y) * (b.y - y);
    if (d < bd){ bd = d; best = i; }
  }
  if (best >= 0){
    butters[best].tx = x + (Math.random() - 0.5) * 30;
    butters[best].ty = y - f.stem - f.size * 0.6;
    butters[best].wait = 0;
  }

  if (bloomed % 12 === 0){
    sCheer();
    for (var i = 0; i < butters.length; i++){
      butters[i].tx = x + (Math.random() - 0.5) * W * 0.4;
      butters[i].ty = HZ + Math.random() * (H - HZ) * 0.8;
      butters[i].wait = 0;
    }
    if (butters.length < 7) butters.push(makeButterfly());
  }

  // 増えすぎた古い花から、しぼまずゆっくり消える
  var alive = 0;
  for (var i = 0; i < flowers.length; i++) if (!flowers[i].dying) alive++;
  if (alive > MAXF){
    for (var i = 0; i < flowers.length && alive > MAXF; i++){
      if (!flowers[i].dying){ flowers[i].dying = 1; alive--; }
    }
  }
}

function sky(x, y){
  sparks.push({ x: x, y: y, r: unit() * 0.03, hue: 48, life: 1 });
  for (var i = 0; i < 5; i++){
    var a = Math.random() * 6.283, v = 20 + Math.random() * 50;
    puffs.push({
      x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 14,
      r: 2 + Math.random() * 4,
      hue: HUES[Math.floor(Math.random() * HUES.length)], life: 1
    });
  }
  if (birds.length < MAXB) birds.push(makeBird(x, y));
  else { birds.shift(); birds.push(makeBird(x, y)); }
  sChirp();
}

function touch(x, y){
  audio();
  if (y > HZ + 4) plant(x, y);
  else sky(x, y);
}

// 手のひらでも複数の指でも壊れないように、指ごとに前の位置を持つ
var live = {};

c.addEventListener('pointerdown', function(e){
  e.preventDefault();
  var r = c.getBoundingClientRect();
  var x = e.clientX - r.left, y = e.clientY - r.top;
  live[e.pointerId] = { x: x, y: y };
  touch(x, y);
}, { passive: false });

c.addEventListener('pointermove', function(e){
  var p = live[e.pointerId]; if (!p) return;
  e.preventDefault();
  var r = c.getBoundingClientRect();
  var x = e.clientX - r.left, y = e.clientY - r.top;
  var dx = x - p.x, dy = y - p.y;
  var need = (y > HZ + 4) ? 44 : 38;
  if (dx * dx + dy * dy < need * need) return;
  p.x = x; p.y = y;
  // なぞると花がつながって咲く。小鳥は押したときだけ
  if (y > HZ + 4) plant(x, y);
  else {
    sparks.push({ x: x, y: y, r: unit() * 0.022, hue: 48, life: 1 });
    for (var i = 0; i < 3; i++){
      var a = Math.random() * 6.283, v = 18 + Math.random() * 40;
      puffs.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 12,
        r: 2 + Math.random() * 3.4, hue: HUES[Math.floor(Math.random() * HUES.length)], life: 1 });
    }
  }
}, { passive: false });

['pointerup','pointercancel','pointerleave'].forEach(function(k){
  c.addEventListener(k, function(e){ delete live[e.pointerId]; });
});
c.addEventListener('contextmenu', function(e){ e.preventDefault(); });

/* ---------- もどる（700ms 長押し） ---------- */
var home = document.getElementById('home'), ht = null;
function hStart(e){
  e.preventDefault(); e.stopPropagation();
  home.classList.add('hold');
  ht = setTimeout(function(){ location.href = '../../'; }, 700);
}
function hEnd(e){
  if (e) e.stopPropagation();
  home.classList.remove('hold');
  if (ht){ clearTimeout(ht); ht = null; }
}
home.addEventListener('pointerdown', hStart, { passive: false });
['pointerup','pointerleave','pointercancel'].forEach(function(k){
  home.addEventListener(k, hEnd);
});

/* ---------- 描く ---------- */
function drawCloud(cl){
  var s = cl.s * unit() * 0.075;
  ctx.fillStyle = 'rgba(255,253,246,.72)';
  ctx.beginPath();
  ctx.arc(cl.x, cl.y, s, 0, 6.283);
  ctx.arc(cl.x + s * 0.9, cl.y + s * 0.16, s * 0.72, 0, 6.283);
  ctx.arc(cl.x - s * 0.85, cl.y + s * 0.2, s * 0.62, 0, 6.283);
  ctx.arc(cl.x + s * 0.1, cl.y + s * 0.45, s * 0.8, 0, 6.283);
  ctx.fill();
}

function drawBird(b, t){
  var f = Math.sin(t * 7 + b.ph);
  var s = b.sz;
  ctx.strokeStyle = 'rgba(88,104,110,.8)';
  ctx.lineWidth = Math.max(1.8, s * 0.16);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(b.x - s, b.y + f * s * 0.42);
  ctx.quadraticCurveTo(b.x - s * 0.45, b.y - s * 0.5 + f * s * 0.1, b.x, b.y);
  ctx.quadraticCurveTo(b.x + s * 0.45, b.y - s * 0.5 + f * s * 0.1, b.x + s, b.y + f * s * 0.42);
  ctx.stroke();
}

function drawFlower(f, t){
  var g = f.sc;
  if (g <= 0.001) return;
  var sway = Math.sin(t * f.sw + f.ph) * 0.13;
  var s = f.size * g;
  var stem = f.stem * g;
  var hx = f.x + Math.sin(sway) * stem * 0.55;
  var hy = f.y - stem;

  // 茎
  ctx.strokeStyle = 'rgba(58,124,66,.92)';
  ctx.lineWidth = Math.max(2, s * 0.14);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(f.x, f.y);
  ctx.quadraticCurveTo(f.x + Math.sin(sway) * stem * 0.2, f.y - stem * 0.55, hx, hy);
  ctx.stroke();

  // 葉
  ctx.fillStyle = 'rgba(74,148,80,.95)';
  var ly = f.y - stem * 0.45;
  ctx.beginPath();
  ctx.ellipse(f.x - s * 0.5, ly, s * 0.5, s * 0.2, -0.5 + sway, 0, 6.283);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(f.x + s * 0.45, ly + s * 0.3, s * 0.4, s * 0.17, 0.5 + sway, 0, 6.283);
  ctx.fill();

  var col = 'hsl(' + f.hue + ',' + f.sat + '%,' + f.lig + '%)';
  var col2 = 'hsl(' + f.hue + ',' + Math.min(95, f.sat + 12) + '%,' + Math.max(52, f.lig - 16) + '%)';

  ctx.save();
  ctx.translate(hx, hy);
  ctx.rotate(sway * 0.7);

  if (f.kind === 1){
    // チューリップ
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(-s * 0.62, -s * 0.1);
    ctx.quadraticCurveTo(-s * 0.7, s * 0.72, 0, s * 0.8);
    ctx.quadraticCurveTo(s * 0.7, s * 0.72, s * 0.62, -s * 0.1);
    ctx.quadraticCurveTo(s * 0.34, s * 0.16, s * 0.2, -s * 0.5);
    ctx.quadraticCurveTo(s * 0.04, s * 0.2, -s * 0.2, -s * 0.5);
    ctx.quadraticCurveTo(-s * 0.34, s * 0.16, -s * 0.62, -s * 0.1);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.28)';
    ctx.beginPath();
    ctx.ellipse(-s * 0.22, s * 0.24, s * 0.15, s * 0.34, -0.2, 0, 6.283);
    ctx.fill();
  } else {
    var n = (f.kind === 2) ? f.petals + 4 : f.petals;
    var pr = (f.kind === 2) ? s * 0.24 : s * 0.42;
    var pd = (f.kind === 3) ? s * 0.6 : s * 0.55;
    for (var i = 0; i < n; i++){
      var a = (i / n) * 6.283 + f.ph * 0.3;
      var px = Math.cos(a) * pd, py = Math.sin(a) * pd;
      ctx.fillStyle = (i % 2 === 0) ? col : col2;
      ctx.beginPath();
      if (f.kind === 2) ctx.ellipse(px, py, pr, pr * 0.44, a, 0, 6.283);
      else ctx.ellipse(px, py, pr, pr * 0.9, a, 0, 6.283);
      ctx.fill();
    }
    if (f.kind === 3){
      for (var i = 0; i < n; i++){
        var a2 = (i / n) * 6.283 + 0.4 + f.ph * 0.3;
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.ellipse(Math.cos(a2) * s * 0.3, Math.sin(a2) * s * 0.3, s * 0.26, s * 0.24, a2, 0, 6.283);
        ctx.fill();
      }
    }
  }

  // 花の芯
  ctx.fillStyle = 'hsl(' + f.core + ',82%,62%)';
  ctx.beginPath();
  ctx.arc(0, 0, s * (f.kind === 1 ? 0.0 : 0.28), 0, 6.283);
  ctx.fill();
  if (f.kind !== 1){
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.beginPath();
    ctx.arc(-s * 0.08, -s * 0.08, s * 0.1, 0, 6.283);
    ctx.fill();
  }
  ctx.restore();
}

function drawButterfly(b, t){
  var f = Math.abs(Math.sin(t * 9 + b.flap));
  var s = b.sz;
  var w = 0.34 + 0.66 * f;
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(Math.atan2(b.vy, b.vx) * 0.12);
  var c1 = 'hsla(' + b.hue + ',78%,74%,.92)';
  var c2 = 'hsla(' + ((b.hue + 26) % 360) + ',80%,84%,.92)';
  for (var side = -1; side <= 1; side += 2){
    ctx.fillStyle = c1;
    ctx.beginPath();
    ctx.ellipse(side * s * 0.52 * w, -s * 0.2, s * 0.52 * w, s * 0.42, side * 0.38, 0, 6.283);
    ctx.fill();
    ctx.fillStyle = c2;
    ctx.beginPath();
    ctx.ellipse(side * s * 0.42 * w, s * 0.26, s * 0.4 * w, s * 0.3, -side * 0.34, 0, 6.283);
    ctx.fill();
  }
  ctx.fillStyle = 'rgba(78,66,58,.9)';
  ctx.beginPath();
  ctx.ellipse(0, 0, s * 0.09, s * 0.34, 0, 0, 6.283);
  ctx.fill();
  ctx.restore();
}

/* ---------- ループ ---------- */
var last = 0, T = 0;
function frame(now){
  var dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
  last = now; T += dt;

  // 空
  ctx.fillStyle = SKY;
  ctx.fillRect(0, 0, W, HZ + 1);

  // おひさま
  var sx = W * 0.82, sy = HZ * 0.3, sr = unit() * 0.062;
  var sg = ctx.createRadialGradient(sx, sy, sr * 0.2, sx, sy, sr * 2.4);
  sg.addColorStop(0,   'rgba(255,240,190,.95)');
  sg.addColorStop(0.4, 'rgba(255,232,168,.45)');
  sg.addColorStop(1,   'rgba(255,232,168,0)');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(sx, sy, sr * 2.4, 0, 6.283); ctx.fill();
  ctx.fillStyle = 'rgba(255,246,214,.98)';
  ctx.beginPath(); ctx.arc(sx, sy, sr * (1 + Math.sin(T * 0.8) * 0.02), 0, 6.283); ctx.fill();

  for (var i = 0; i < clouds.length; i++){
    var cl = clouds[i];
    cl.x += cl.sp * dt;
    if (cl.x - unit() * 0.2 > W) cl.x = -unit() * 0.2;
    drawCloud(cl);
  }

  for (var i = birds.length - 1; i >= 0; i--){
    var bd = birds[i];
    bd.x += bd.dir * bd.sp * dt;
    bd.y += Math.sin(T * 1.6 + bd.ph) * bd.bob * dt;
    if (bd.y < 12) bd.y = 12;
    if (bd.y > HZ - 12) bd.y = HZ - 12;
    if (bd.x < -60 || bd.x > W + 60){ birds.splice(i, 1); continue; }
    drawBird(bd, T);
  }

  // 地面
  ctx.fillStyle = FIELD;
  ctx.fillRect(0, HZ, W, H - HZ);
  for (var i = 0; i < HILLS.length; i++){
    var hl = HILLS[i];
    ctx.fillStyle = hl.col;
    ctx.beginPath();
    ctx.ellipse(hl.cx, HZ + hl.ry * 0.35, hl.rx, hl.ry, 0, Math.PI, 0);
    ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,255,255,.14)';
  ctx.fillRect(0, HZ, W, 2);

  // 草
  ctx.lineCap = 'round';
  for (var i = 0; i < BLADES.length; i++){
    var bl = BLADES[i];
    var k = bl.lean * bl.h + Math.sin(T * 1.1 + bl.ph) * bl.h * 0.14;
    ctx.strokeStyle = bl.col;
    ctx.lineWidth = bl.wd;
    ctx.beginPath();
    ctx.moveTo(bl.x, bl.y);
    ctx.quadraticCurveTo(bl.x + k * 0.3, bl.y - bl.h * 0.62, bl.x + k, bl.y - bl.h);
    ctx.stroke();
  }

  // 花。手前ほどあとに描く
  flowers.sort(function(a, b){ return a.y - b.y; });
  for (var i = flowers.length - 1; i >= 0; i--){
    var f = flowers[i];
    if (f.dying){
      f.sc -= dt * 0.5;
      if (f.sc <= 0){ flowers.splice(i, 1); continue; }
    } else if (f.sc < 1){
      // すこし跳ねながら伸びる
      f.born += dt;
      var p = Math.min(1, f.born / 0.42);
      f.sc = 1 - Math.pow(1 - p, 3);
      if (p < 1) f.sc = f.sc * (1 + Math.sin(p * 3.14159) * 0.16);
      if (p >= 1) f.sc = 1;
    }
    drawFlower(f, T);
  }

  // ちょうちょ
  for (var i = 0; i < butters.length; i++){
    var b = butters[i];
    var dx = b.tx - b.x, dy = b.ty - b.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d < 14){
      b.wait += dt;
      if (b.wait > 1.2 + Math.random() * 1.6){
        b.wait = 0;
        if (flowers.length && Math.random() < 0.7){
          var tf = flowers[Math.floor(Math.random() * flowers.length)];
          b.tx = tf.x + (Math.random() - 0.5) * 26;
          b.ty = tf.y - tf.stem - tf.size * 0.5;
        } else {
          b.tx = 24 + Math.random() * (W - 48);
          b.ty = HZ + Math.random() * (H - HZ) * 0.85;
        }
      }
    } else {
      b.vx += (dx / d) * 240 * dt;
      b.vy += (dy / d) * 240 * dt;
    }
    b.vx *= 0.94; b.vy *= 0.94;
    b.x += b.vx * dt + Math.sin(T * 3 + b.flap) * 14 * dt;
    b.y += b.vy * dt + Math.cos(T * 2.4 + b.flap) * 12 * dt;
    if (b.x < 10) b.x = 10; if (b.x > W - 10) b.x = W - 10;
    if (b.y < 10) b.y = 10; if (b.y > H - 10) b.y = H - 10;
    drawButterfly(b, T);
  }

  // きらきら
  for (var i = sparks.length - 1; i >= 0; i--){
    var sp = sparks[i];
    sp.life -= dt * 2.1;
    if (sp.life <= 0){ sparks.splice(i, 1); continue; }
    var e = 1 - sp.life;
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, sp.r + e * sp.r * 2.6, 0, 6.283);
    ctx.strokeStyle = 'hsla(' + sp.hue + ',88%,84%,' + (sp.life * 0.7) + ')';
    ctx.lineWidth = 2 + sp.life * 3;
    ctx.stroke();
  }
  if (sparks.length > 26) sparks.splice(0, sparks.length - 26);

  for (var i = puffs.length - 1; i >= 0; i--){
    var p = puffs[i];
    p.life -= dt * 1.35;
    if (p.life <= 0){ puffs.splice(i, 1); continue; }
    p.vy += 46 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, 6.283);
    ctx.fillStyle = 'hsla(' + p.hue + ',85%,84%,' + (p.life * 0.85) + ')';
    ctx.fill();
  }
  if (puffs.length > 60) puffs.splice(0, puffs.length - 60);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
