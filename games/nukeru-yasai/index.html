<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#e5d7b9">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ぬけるやさい</title>
<style>
  :root{ color-scheme: light; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    width:100%; height:100%; overflow:hidden;
    background:#e5d7b9;
    overscroll-behavior:none; touch-action:none;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
    font-family: system-ui, -apple-system, "Segoe UI",
      "Hiragino Kaku Gothic ProN", "Hiragino Sans",
      "BIZ UDPGothic", "Yu Gothic Medium", "Yu Gothic", YuGothic,
      Meiryo, "Noto Sans JP", sans-serif;
  }
  #c{ position:fixed; inset:0; width:100%; height:100dvh; display:block; }
  #home{
    position:fixed; top:max(10px, env(safe-area-inset-top)); left:max(10px, env(safe-area-inset-left));
    width:40px; height:40px; padding:0; border:0; border-radius:50%;
    background:rgba(255,255,255,.42); backdrop-filter:blur(2px);
    display:grid; place-items:center; cursor:pointer; z-index:5;
    touch-action:none; -webkit-tap-highlight-color:transparent;
  }
  #home svg{ width:34px; height:34px; display:block; }
  #home .trk{ fill:none; stroke:rgba(74,92,96,.22); stroke-width:2.5; }
  #home .rng{
    fill:none; stroke:#4a5c60; stroke-width:2.5; stroke-linecap:round;
    stroke-dasharray:94.2; stroke-dashoffset:94.2;
    transform:rotate(-90deg); transform-origin:50% 50%;
    transition:stroke-dashoffset .04s linear;
  }
  #home.hold .rng{ stroke-dashoffset:0; transition:stroke-dashoffset .7s linear; }
  #home .ico{ fill:#4a5c60; opacity:.72; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="home" aria-label="おもちゃばこに もどる">
  <svg viewBox="0 0 36 36" aria-hidden="true">
    <circle class="trk" cx="18" cy="18" r="15"/>
    <circle class="rng" cx="18" cy="18" r="15"/>
    <path class="ico" d="M18 9.4 10.2 16v9.1c0 .6.5 1.1 1.1 1.1h4.1v-5.3h5.2v5.3h4.1c.6 0 1.1-.5 1.1-1.1V16z"/>
  </svg>
</button>
<script>
(function(){
'use strict';

/* ---------- 画面 ---------- */
var c = document.getElementById('c'), ctx = c.getContext('2d');
var W = 0, H = 0, DPR = 1, LAND = false, groundY = 0, HR = 1;
var SKY = null, SOIL = null, VS = 1;

function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function rnd(a, b){ return a + Math.random() * (b - a); }
function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  var r = c.getBoundingClientRect();
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  c.width = Math.round(W * DPR); c.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  LAND = W > H;
  groundY = Math.round(H * (LAND ? 0.42 : 0.46));
  HR = clamp(Math.min(W, H) / 390, 0.62, 1.5);
  VS = clamp(Math.min(W / 300, groundY / 250), 0.55, 1.7) * 0.72;
  SKY = ctx.createLinearGradient(0, 0, 0, groundY);
  SKY.addColorStop(0,   '#cfe1e6');
  SKY.addColorStop(0.6, '#e2ecdf');
  SKY.addColorStop(1,   '#f0e8cf');
  SOIL = ctx.createLinearGradient(0, groundY, 0, H);
  SOIL.addColorStop(0,   '#a78156');
  SOIL.addColorStop(0.5, '#8d6944');
  SOIL.addColorStop(1,   '#6e5235');
  relayout();
  makeSpecks();
  makeLayer();
  layoutHelpers();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 120); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

/* ---------- 音 ---------- */
var ac = null, master = null, noiseBuf = null, loopBuf = null, voices = 0;
var MAXV = 9;

function audio(){
  if (ac){ if (ac.state === 'suspended') ac.resume(); return ac; }
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  try { ac = new AC(); } catch(e){ return null; }
  var comp = ac.createDynamicsCompressor();
  comp.threshold.value = -17; comp.knee.value = 22; comp.ratio.value = 9;
  comp.attack.value = 0.003; comp.release.value = 0.22;
  master = ac.createGain(); master.gain.value = 0.52;
  master.connect(comp); comp.connect(ac.destination);
  var n = Math.floor(ac.sampleRate * 0.16), d, i;
  noiseBuf = ac.createBuffer(1, n, ac.sampleRate);
  d = noiseBuf.getChannelData(0);
  for (i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.2);
  var m = Math.floor(ac.sampleRate * 1.4);
  loopBuf = ac.createBuffer(1, m, ac.sampleRate);
  d = loopBuf.getChannelData(0);
  for (i = 0; i < m; i++) d[i] = Math.random() * 2 - 1;
  return ac;
}
function jit(v, p){ return v * (1 + (Math.random() * 2 - 1) * (p === undefined ? 0.04 : p)); }
function slot(){ if (voices >= MAXV) return false; voices++; return true; }
function freeV(){ voices = Math.max(0, voices - 1); }

/* 単音。押した数だけ呼ぶと和音になる */
function ping(f, dur, type, vol){
  var a = audio(); if (!a) return;
  if (!slot()) return;
  var t = a.currentTime;
  var o = a.createOscillator(); o.type = type || 'sine';
  o.frequency.value = jit(f);
  var g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.17, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.2));
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + (dur || 0.2) + 0.03);
  o.onended = freeV;
}

/* 土をさわった音。どこを押しても必ず1つ鳴らす */
function sSoil(k){
  var a = audio(); if (!a) return;
  var t = a.currentTime;
  var s = a.createBufferSource(); s.buffer = noiseBuf;
  var bp = a.createBiquadFilter(); bp.type = 'bandpass';
  bp.frequency.value = jit(520 + k * 900, 0.12); bp.Q.value = 1.1;
  var gn = a.createGain();
  gn.gain.setValueAtTime(0.22, t);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
  s.connect(bp); bp.connect(gn); gn.connect(master); s.start(t);
  var o = a.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(jit(150 + k * 90), t);
  o.frequency.exponentialRampToValueAtTime(jit(78), t + 0.14);
  var g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.16, t + 0.007);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.18);
}

/* 引いているあいだ鳴り続ける1声。手を止めても離すまで量に追従する */
function pullVoice(){
  var a = audio(); if (!a) return null;
  var o = a.createOscillator(); o.type = 'triangle';
  var lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
  var g = a.createGain(); g.gain.value = 0.0001;
  o.connect(lp); lp.connect(g); g.connect(master);
  o.start();
  var s = a.createBufferSource(); s.buffer = loopBuf; s.loop = true;
  var bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 600; bp.Q.value = 0.9;
  var ng = a.createGain(); ng.gain.value = 0.0001;
  s.connect(bp); bp.connect(ng); ng.connect(master);
  s.start();
  var live = true;
  return {
    update: function(k, sp){
      if (!live) return;
      var t = a.currentTime;
      o.frequency.setTargetAtTime(110 + k * 210, t, 0.03);
      g.gain.setTargetAtTime(0.03 + k * 0.17, t, 0.04);
      lp.frequency.setTargetAtTime(420 + k * 1700, t, 0.04);
      bp.frequency.setTargetAtTime(500 + k * 2200, t, 0.03);
      ng.gain.setTargetAtTime(0.012 + Math.min(0.14, sp * 0.00016), t, 0.03);
    },
    stop: function(){
      if (!live) return; live = false;
      var t = a.currentTime;
      g.gain.setTargetAtTime(0, t, 0.05);
      ng.gain.setTargetAtTime(0, t, 0.02);
      o.stop(t + 0.4); s.stop(t + 0.2);
    }
  };
}

/* すぽん */
function sPop(f){
  var a = audio(); if (!a) return;
  var t = a.currentTime;
  var o = a.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(jit(f * 0.5), t);
  o.frequency.exponentialRampToValueAtTime(jit(f * 2.1), t + 0.055);
  o.frequency.exponentialRampToValueAtTime(jit(f * 0.9), t + 0.2);
  var g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.4, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.36);
  var s = a.createBufferSource(); s.buffer = noiseBuf;
  var bp = a.createBiquadFilter(); bp.type = 'bandpass';
  bp.frequency.value = jit(1400, 0.2); bp.Q.value = 1.4;
  var gn = a.createGain();
  gn.gain.setValueAtTime(0.3, t);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
  s.connect(bp); bp.connect(gn); gn.connect(master); s.start(t);
}

/* ---------- やさい ---------- */
/* 形、色、大きさ、抜けたときの音程が1つずつ違う。直前に出たものは選ばない */
var KINDS = [
  { id:'kabu',   body:'#f0ebdc', dark:'#c2b99e', leaf:'#7fa64d', len:86,  wid:88, prof:'bulb', lump:0.05, tail:0.30, freq:587 },
  { id:'ninjin', body:'#df8945', dark:'#bd6a2e', leaf:'#6f9b48', len:128, wid:48, prof:'cone', lump:0.03, tail:0.22, freq:698 },
  { id:'daikon', body:'#eeefe3', dark:'#b8bba6', leaf:'#86ab52', len:152, wid:46, prof:'cone', lump:0.02, tail:0.20, freq:494 },
  { id:'imo',    body:'#b06a86', dark:'#8e5069', leaf:'#7aa257', len:130, wid:58, prof:'oval', lump:0.06, tail:0.16, freq:440 },
  { id:'jaga',   body:'#d8b779', dark:'#b9975c', leaf:'#87a860', len:82,  wid:90, prof:'bulb', lump:0.12, tail:0.10, freq:523 },
  { id:'tama',   body:'#e5c98d', dark:'#c4a66a', leaf:'#9ab35c', len:90,  wid:86, prof:'bulb', lump:0.04, tail:0.34, freq:659 },
  { id:'gobo',   body:'#a8814f', dark:'#8a663a', leaf:'#789c4d', len:168, wid:28, prof:'cone', lump:0.05, tail:0.26, freq:349 },
  { id:'beets',  body:'#b3546a', dark:'#8f3e52', leaf:'#7fa356', len:96,  wid:84, prof:'bulb', lump:0.04, tail:0.38, freq:784 }
];

/* 幅の輪郭。u は 0（肩）から 1（先） */
function wprof(k, u){
  var w;
  if (k.prof === 'cone')      w = Math.pow(Math.max(0, 1 - u), 0.72);
  else if (k.prof === 'oval') w = Math.pow(Math.sin(Math.PI * clamp(u, 0, 1)), 0.42);
  else                        w = Math.pow(Math.sin(Math.PI * clamp(u * 0.97 + 0.03, 0, 1)), 0.55);
  return Math.max(w, k.prof === 'cone' ? 0 : 0.12 * (1 - u));
}

/* 本体。原点は肩の中心、+y が土の中 */
function drawBody(k, sc, tr, t, seed){
  var len = k.len * sc, wid = k.wid * sc, i, u, w, x, y;
  ctx.beginPath();
  for (i = 0; i <= 26; i++){
    u = i / 26;
    w = wprof(k, u) * wid * 0.5 * (1 + k.lump * Math.sin(u * 9.3 + seed));
    x = w + tr * Math.sin(u * 13 + t * 24 + seed);
    y = u * len;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  /* 先の細い根 */
  ctx.quadraticCurveTo(wid * 0.05, len * (1 + k.tail * 0.5), 0, len * (1 + k.tail));
  ctx.quadraticCurveTo(-wid * 0.05, len * (1 + k.tail * 0.5), -wprof(k, 1) * wid * 0.5, len);
  for (i = 26; i >= 0; i--){
    u = i / 26;
    w = wprof(k, u) * wid * 0.5 * (1 + k.lump * Math.sin(u * 9.3 + seed));
    ctx.lineTo(-w + tr * Math.sin(u * 13 + t * 24 + seed), u * len);
  }
  ctx.closePath();
  ctx.fillStyle = k.body; ctx.fill();
  ctx.save(); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,.26)';
  ctx.beginPath(); ctx.ellipse(-wid * 0.17, len * 0.34, wid * 0.16, len * 0.3, -0.2, 0, 6.3); ctx.fill();
  ctx.fillStyle = 'rgba(90,64,38,.16)';
  for (i = 0; i < 4; i++){
    ctx.beginPath();
    ctx.ellipse(wid * 0.1, len * (0.2 + i * 0.2), wid * 0.32, len * 0.03, 0.1, 0, 6.3);
    ctx.fill();
  }
  ctx.restore();
  ctx.lineWidth = Math.max(3, 3.4 * sc); ctx.strokeStyle = k.dark; ctx.stroke();
}

/* 葉。dir は指の方角、st は伸び具合 */
function drawLeaves(k, sc, n, dir, st, t, seed, tr){
  var i, a, L, bw, tipx, tipy, mx, my;
  for (i = 0; i < n; i++){
    a = (i - (n - 1) / 2) * (0.42 - st * 0.13) + Math.sin(t * 0.9 + i * 1.7 + seed) * 0.06;
    a = a * (1 - st * 0.55) + dir * st * 0.78;
    L = (30 + k.len * 0.36) * sc * (0.8 + (i % 2) * 0.24) * (1 + st * 0.58);
    bw = (7 + k.wid * 0.055) * sc * (1 - st * 0.28);
    tipx = Math.sin(a) * L + tr * Math.sin(t * 22 + i);
    tipy = -Math.cos(a) * L;
    mx = Math.sin(a) * L * 0.5 - Math.cos(a) * L * 0.16 * (1 - st);
    my = -Math.cos(a) * L * 0.5 - Math.sin(a) * L * 0.1;
    ctx.beginPath();
    ctx.moveTo(-bw * 0.5, 2);
    ctx.quadraticCurveTo(mx - bw * 0.9, my, tipx, tipy);
    ctx.quadraticCurveTo(mx + bw * 0.9, my, bw * 0.5, 2);
    ctx.closePath();
    ctx.fillStyle = i % 2 ? k.leaf : shade(k.leaf, -14);
    ctx.fill();
    ctx.lineWidth = Math.max(2.4, 2.6 * sc); ctx.strokeStyle = shade(k.leaf, -30); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, 2); ctx.quadraticCurveTo(mx, my, tipx, tipy);
    ctx.lineWidth = Math.max(2, 2.2 * sc); ctx.strokeStyle = shade(k.leaf, 22); ctx.stroke();
  }
}

function shade(hex, d){
  var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  r = clamp(r + d, 0, 255); g = clamp(g + d, 0, 255); b = clamp(b + d, 0, 255);
  return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
}


function mix(a, b, t){
  var ar = parseInt(a.slice(1, 3), 16), ag = parseInt(a.slice(3, 5), 16), ab = parseInt(a.slice(5, 7), 16);
  var br = parseInt(b.slice(1, 3), 16), bg = parseInt(b.slice(3, 5), 16), bb = parseInt(b.slice(5, 7), 16);
  return 'rgb(' + Math.round(ar + (br - ar) * t) + ',' + Math.round(ag + (bg - ag) * t) + ',' +
         Math.round(ab + (bb - ab) * t) + ')';
}

/* ---------- 手伝いの生きもの ---------- */
var HCOL = ['#e0a35c', '#cf7f6e', '#8fae6a', '#6fa2a8', '#c59bb0', '#d9c06a', '#9a9ad0', '#e2b98c'];

function makeHelper(){
  return {
    col: pick(HCOL), seed: rnd(0, 6.3), sc: rnd(0.86, 1.16),
    hx: W / 2, hy: H - 50, lean: 0, fall: 0, fallAt: 0, upAt: 0, rung: false,
    hop: 0, look: 0
  };
}

function layoutHelpers(){
  var n = helpers.length, i, span, gap, y;
  y = H - Math.max(36, (H - groundY) * 0.15);
  span = Math.min(W * 0.84, 372 * HR);
  gap = span / 6;
  for (i = 0; i < n; i++){
    helpers[i].hx = W / 2 + (i - (n - 1) / 2) * gap;
    helpers[i].hy = y;
  }
}

/* ef は 0 から 1 の力み具合。引きの量をそのまま渡す */
function drawHelper(hp, t, ef){
  var R = 25 * HR * hp.sc;
  var br = 1 + Math.sin(t * 2.1 + hp.seed) * 0.03;
  var down = Math.abs(hp.fall) > 0.5;
  var e = down ? 0 : ef;
  var sq = 1 + e * 0.16;
  ctx.save();
  ctx.translate(hp.hx, hp.hy - hp.hop);
  ctx.fillStyle = 'rgba(80,58,36,.16)';
  ctx.beginPath(); ctx.ellipse(0, R * 0.92, R * 0.86, R * 0.2, 0, 0, 6.283); ctx.fill();
  ctx.rotate(hp.lean + hp.fall);
  ctx.beginPath();
  ctx.ellipse(0, e * R * 0.1, R * 0.82 / br * sq, R * 0.92 * br / sq, 0, 0, 6.283);
  ctx.fillStyle = e > 0.02 ? mix(hp.col, '#d4705e', e * 0.34) : hp.col;
  ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = shade(hp.col, -46); ctx.stroke();
  ctx.fillStyle = shade(hp.col, -50);
  ctx.beginPath(); ctx.ellipse(-R * (0.3 + e * 0.17), R * 0.9, R * 0.16, R * 0.12, 0, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.ellipse(R * (0.3 + e * 0.17), R * 0.9, R * 0.16, R * 0.12, 0, 0, 6.283); ctx.fill();
  /* て。力むほど後ろへ張る */
  if (e > 0.05){
    ctx.strokeStyle = shade(hp.col, -38);
    ctx.lineWidth = Math.max(3, R * 0.17); ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-R * 0.66, R * 0.12); ctx.lineTo(-R * (0.66 + e * 0.5), R * (0.12 - e * 0.5));
    ctx.moveTo(R * 0.66, R * 0.12); ctx.lineTo(R * (0.66 + e * 0.5), R * (0.12 - e * 0.5));
    ctx.stroke();
  }
  /* ほお */
  if (e > 0.1){
    ctx.fillStyle = 'rgba(210,102,84,' + (e * 0.42).toFixed(2) + ')';
    ctx.beginPath(); ctx.ellipse(-R * 0.47, R * 0.12, R * 0.18, R * 0.11, 0, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.ellipse(R * 0.47, R * 0.12, R * 0.18, R * 0.11, 0, 0, 6.283); ctx.fill();
  }
  /* め。力むほど細くなる。転がっているあいだは丸くなる */
  var ex = hp.look * R * 0.16;
  var ew = R * (0.11 + e * 0.08) * (down ? 1.3 : 1);
  var eh = R * (down ? 0.19 : 0.14 * (1 - e * 0.86));
  ctx.fillStyle = '#4a3a2c';
  ctx.beginPath(); ctx.ellipse(-R * 0.26 + ex, -R * 0.14, ew, eh, 0, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.ellipse(R * 0.26 + ex, -R * 0.14, ew, eh, 0, 0, 6.283); ctx.fill();
  /* まゆ */
  if (e > 0.12){
    ctx.strokeStyle = '#4a3a2c';
    ctx.lineWidth = Math.max(2.4, R * 0.09); ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-R * 0.45, -R * (0.33 + e * 0.06)); ctx.lineTo(-R * 0.12, -R * (0.25 - e * 0.07));
    ctx.moveTo(R * 0.45, -R * (0.33 + e * 0.06)); ctx.lineTo(R * 0.12, -R * (0.25 - e * 0.07));
    ctx.stroke();
  }
  /* くち */
  if (e > 0.18){
    ctx.fillStyle = '#7d4a3a';
    ctx.beginPath();
    ctx.ellipse(0, R * 0.27, R * (0.1 + e * 0.11), R * (0.05 + e * 0.11), 0, 0, 6.283);
    ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,255,255,.32)';
  ctx.beginPath(); ctx.ellipse(-R * 0.24, -R * 0.42, R * 0.22, R * 0.14, -0.3, 0, 6.283); ctx.fill();
  ctx.restore();
  /* あせ。頭の横から飛ぶ */
  if (e > 0.2){
    var i, ph, a2;
    for (i = 0; i < 2; i++){
      ph = (t * (1.4 + i * 0.45) + hp.seed + i * 0.5) % 1;
      a2 = (1 - ph) * (e - 0.2) * 2.6;
      if (a2 <= 0.02) continue;
      ctx.globalAlpha = clamp(a2, 0, 0.85);
      ctx.fillStyle = '#a8d6e6';
      ctx.beginPath();
      ctx.ellipse(hp.hx + (i ? 1 : -1) * R * (0.72 + ph * 0.75),
                  hp.hy - hp.hop - R * (0.5 - ph * 1.05),
                  R * 0.13, R * 0.18, 0, 0, 6.283);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
}

/* ---------- 状態 ---------- */
function now(){ return performance.now(); }
var helpers = [], plants = [], flying = [], dust = [], pile = [];
var pulling = null, lastKind = null, lastInput = now(), leanDir = 1;
var demoT = 0, growT = 0, pileN = 0, LANES = 3, effortG = 0;
var layer = null, lctx = null;

/* この秒数ごとに1本生える。引かないでいると畑が埋まっていく */
var GROW_EVERY = 6.5;

function laneCount(){ return clamp(Math.round(W / (118 * HR)), 3, 6); }
/* 奥の列と、半分ずらした手前の列。手前のほうが少し大きい */
function slotCount(){ return LANES * 2 - 1; }
function slotX(i){
  var lane = i < LANES ? i : i - LANES, span = W * 0.9, x0 = W * 0.05;
  return x0 + span * (lane + 0.5) / LANES + (i < LANES ? 0 : span * 0.5 / LANES);
}
function slotDY(i){ return i < LANES ? 0 : (H - groundY) * 0.13; }
function slotSC(i){ return i < LANES ? 1 : 1.1; }

function relayout(){
  LANES = laneCount();
  while (plants.length > slotCount()) plants.splice(plants.length - 1, 1);
  for (var i = 0; i < plants.length; i++){
    var q = plants[i];
    q.slot = i % slotCount();
    q.x = slotX(q.slot);
    q.dy = slotDY(q.slot);
    q.sc = q.sc0 * VS * slotSC(q.slot);
  }
  sortPlants();
}

/* 奥から先に描くために、深さの順に並べておく */
function sortPlants(){ plants.sort(function(a, b){ return a.dy - b.dy; }); }

function makePlant(slot){
  var k = KINDS[Math.floor(Math.random() * KINDS.length)];
  if (lastKind && k.id === lastKind.id)
    k = KINDS[(KINDS.indexOf(k) + 1 + Math.floor(Math.random() * 7)) % KINDS.length];
  lastKind = k;
  var s0 = rnd(0.88, 1.16);
  return {
    k: k, sc0: s0, sc: s0 * VS * slotSC(slot), seed: rnd(0, 6.3), slot: slot,
    x: slotX(slot), dy: slotDY(slot), grow: 0,
    p: 0, pv: 0, creep: 0, fx: 0, fy: 0, sp: 0, sway: 0, step: 0
  };
}

function freeSlot(){
  var used = {}, i, cand = [];
  for (i = 0; i < plants.length; i++) used[plants[i].slot] = 1;
  for (i = 0; i < slotCount(); i++) if (!used[i]) cand.push(i);
  return cand.length ? pick(cand) : -1;
}

function addPlant(slot){
  if (slot === undefined) slot = freeSlot();
  if (slot < 0 || plants.length >= slotCount()) return null;
  var p = makePlant(slot);
  plants.push(p);
  sortPlants();
  return p;
}

/* ---------- 抜いたやさいを置いておく層 ---------- */
/* 抜いたものは消さない。1枚の絵に焼き付けて残すので、増えても重くならない */
function makeLayer(){
  layer = document.createElement('canvas');
  layer.width = c.width; layer.height = c.height;
  lctx = layer.getContext('2d');
  lctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  for (var i = 0; i < pile.length; i++){
    var r = pile[i];
    r.x = r.fx * W;
    r.y = groundY + r.fy * (H - groundY);
    r.sc = r.sc0 * VS;
    stampVeg(r);
  }
}

function stampVeg(r){
  var old = ctx;
  ctx = lctx;
  ctx.save();
  ctx.translate(r.x, r.y);
  ctx.rotate(r.lie);
  ctx.translate(0, -r.k.len * r.sc * 0.58 * 0.55);
  drawBody(r.k, r.sc * 0.58, 0, 0, r.seed);
  drawLeaves(r.k, r.sc * 0.48, 4, 0, 0, 0, r.seed, 0);
  ctx.restore();
  ctx = old;
}

/* 置き場所。列と段で並べ、埋まったら少しずらして重ねていく */
function pileSpot(k, sc){
  var cols = 3, rows = 5;
  var i = pileN++;
  var col = i % cols, row = Math.floor(i / cols) % rows, lap = Math.floor(i / (cols * rows));
  /* 葉の分まで見込んで、画面からはみ出さない位置に寄せる */
  var ext = k.len * sc * 0.58 * 0.8 + 34 * HR;
  return {
    x: clamp(W * (col + 0.5) / cols + (lap % 3 - 1) * 16 * HR + rnd(-8, 8) * HR,
             Math.min(ext, W * 0.42), Math.max(W - ext, W * 0.58)),
    y: groundY + (H - groundY) * (0.28 + row * 0.105) + rnd(-6, 6) * HR
  };
}

function land(o){
  var r = {
    k: o.k, sc0: o.sc0, sc: o.sc, seed: o.seed, lie: o.lie,
    x: o.x, y: o.y, fx: o.x / W, fy: (o.y - groundY) / Math.max(1, H - groundY)
  };
  pile.push(r);
  while (pile.length > 400) pile.splice(0, 1);
  stampVeg(r);
}

function puff(x, y, n, col, pw){
  var i, a, s;
  for (i = 0; i < n; i++){
    a = rnd(-Math.PI, 0); s = rnd(40, 150) * pw * HR;
    dust.push({
      x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - rnd(10, 70) * HR,
      life: rnd(0.4, 0.9), age: 0, r: rnd(3, 9) * HR, col: col
    });
  }
  while (dust.length > 120) dust.splice(0, 1);
}

/* ---------- 引く ---------- */
/* 抜けるまでの距離。粘らせたいので画面の短い辺の4割ぶん引く */
function pullDist(){ return Math.max(118, Math.min(W, H) * 0.40); }

function crownY(p){ return groundY + p.dy - p.p * p.k.len * p.sc * 0.82; }

/* 引きの量を、見た目の伸びに直す。3か所で少し止まってから、また動く */
function resist(raw){
  var a = 0.055 * Math.sin(clamp(raw, 0, 1) * Math.PI);
  return clamp(raw - a * Math.max(0, Math.sin((raw - 0.08) * Math.PI * 7)), 0, 1);
}

function grabAt(x, y){
  var best = null, bd = 1e9, i, p, dx, dy, d;
  var r = Math.max(58, 0.155 * Math.min(W, H));
  for (i = 0; i < plants.length; i++){
    p = plants[i];
    dx = x - p.x; dy = y - (crownY(p) - 26 * HR);
    d = dx * dx + dy * dy;
    if (d < r * r && d < bd){ bd = d; best = p; }
  }
  return best;
}

function startPull(p, id, x, y){
  pulling = { p: p, id: id, voice: pullVoice() };
  p.fx = x; p.fy = y; p.creep = 0; p.step = 0; p.sway = 0;
  p.p = Math.max(p.p, 0.06);
  leanDir = p.x > W / 2 ? -1 : 1;
}

function endPull(){
  if (!pulling) return;
  var p = pulling.p;
  if (pulling.voice) pulling.voice.stop();
  pulling = null;
  p.creep = 0; p.step = 0;
  if (p.p > 0.12){
    ping(jit(p.k.freq * 0.6), 0.18, 'sine', 0.1);
    puff(p.x, groundY + p.dy, 5, '#8a6a45', 0.5);
  }
}

function popOut(p){
  var k = p.k, sc = p.sc, slot = p.slot;
  var ang = Math.atan2(p.fy - (groundY - 40 * HR), p.fx - p.x);
  var cy = crownY(p);
  var vy = -Math.abs(Math.sin(ang) * 430 * HR) * 0.62 - 150 * HR;
  var g = 1750 * HR;
  var spot = pileSpot(k, sc);
  var tt = (-vy + Math.sqrt(Math.max(1, vy * vy + 2 * g * Math.max(10, spot.y - cy)))) / g;
  sPop(k.freq);
  puff(p.x, groundY + p.dy, 16, '#8a6a45', 1.5);
  flying.push({
    k: k, sc0: p.sc0, sc: sc, seed: p.seed, x: p.x, y: cy,
    vx: (spot.x - p.x) / Math.max(0.15, tt), vy: vy, rot: 0,
    rv: (spot.x > p.x ? 1 : -1) * rnd(3, 6),
    lie: (Math.random() < 0.5 ? 1.57 : -1.57) + rnd(-0.2, 0.2), yr: spot.y
  });
  /* 連れが1体増える。上限6体で古いものと入れ替える */
  helpers.push(makeHelper());
  while (helpers.length > 6) helpers.splice(0, 1);
  layoutHelpers();
  var t = now() / 1000, i, idx;
  for (i = 0; i < helpers.length; i++){
    idx = leanDir > 0 ? helpers.length - 1 - i : i;
    helpers[idx].fallAt = t + 0.06 + i * 0.1;
    helpers[idx].upAt = t + 1.15 + i * 0.1;
    helpers[idx].rung = false;
  }
  if (pulling && pulling.p === p){
    if (pulling.voice) pulling.voice.stop();
    pulling = null;
  }
  plants.splice(plants.indexOf(p), 1);
  /* 抜いた跡にすぐ次の芽が出る */
  addPlant(slot);
  ping(jit(660), 0.1, 'triangle', 0.07);
}

/* ---------- 入力 ---------- */
var pts = {};

function down(e){
  audio();
  var r = c.getBoundingClientRect();
  var x = e.clientX - r.left, y = e.clientY - r.top;
  lastInput = now(); demoT = 0;
  pts[e.pointerId] = { x: x, y: y };
  var i, hp, dx, dy, R;
  /* どこを押しても土煙と短い音が返る */
  if (y > groundY - 6){
    puff(x, y, 5, '#8a6a45', 0.7);
    sSoil(clamp((y - groundY) / Math.max(1, H - groundY), 0, 1));
  } else {
    puff(x, y, 4, '#dfe6d8', 0.5);
    sSoil(0.9);
  }
  for (i = 0; i < helpers.length; i++){
    hp = helpers[i]; R = 27 * HR * hp.sc * 1.5;
    dx = x - hp.hx; dy = y - (hp.hy - 12 * HR);
    if (dx * dx + dy * dy < R * R){
      hp.hop = 13 * HR; hp.look = clamp((x - hp.hx) / R, -1, 1);
      ping(jit(392 + i * 62), 0.16, 'triangle', 0.12);
    }
  }
  if (!pulling){
    var g = grabAt(x, y);
    if (g) startPull(g, e.pointerId, x, y);
  }
  if (e.cancelable) e.preventDefault();
}

function move(e){
  var p = pts[e.pointerId]; if (!p) return;
  var r = c.getBoundingClientRect();
  p.x = e.clientX - r.left; p.y = e.clientY - r.top;
  lastInput = now();
  if (pulling && pulling.id === e.pointerId){
    var q = pulling.p;
    q.sp = Math.hypot(p.x - q.fx, p.y - q.fy) * 60;
    q.fx = p.x; q.fy = p.y;
  }
}

function up(e){
  if (pulling && pulling.id === e.pointerId) endPull();
  delete pts[e.pointerId];
  lastInput = now();
}

c.addEventListener('pointerdown', down, { passive: false });
window.addEventListener('pointermove', move, true);
['pointerup', 'pointercancel', 'pointerleave'].forEach(function(k){
  window.addEventListener(k, up, true);
});
c.addEventListener('contextmenu', function(e){ e.preventDefault(); });

/* ---------- もどる（700ms 長押し） ---------- */
var home = document.getElementById('home'), ht = null;
function hStart(e){
  e.preventDefault(); e.stopPropagation();
  home.classList.add('hold');
  ht = setTimeout(function(){ location.href = '../../'; }, 700);
}
function hEnd(e){
  if (e) e.stopPropagation();
  home.classList.remove('hold');
  if (ht){ clearTimeout(ht); ht = null; }
}
home.addEventListener('pointerdown', hStart, { passive: false });
['pointerup','pointerleave','pointercancel'].forEach(function(k){
  home.addEventListener(k, hEnd);
});

/* ---------- 土の模様 ---------- */
var spx = [];
function makeSpecks(){
  spx = [];
  var n = Math.floor((W * (H - groundY)) / 2600), i;
  for (i = 0; i < n; i++){
    spx.push({
      x: rnd(0, W), y: rnd(groundY + 6, H), r: rnd(1.6, 4.4) * HR,
      c: Math.random() < 0.5 ? 'rgba(232,215,186,.22)' : 'rgba(72,52,32,.20)'
    });
  }
}

/* holes は穴の一覧。生えている本数だけ開ける */
function drawSoil(holes){
  var x, i, s, hl;
  ctx.beginPath();
  ctx.moveTo(0, groundY);
  for (x = 0; x <= W; x += 14) ctx.lineTo(x, groundY + Math.sin(x * 0.021) * 2.4);
  ctx.lineTo(W, groundY + Math.sin(W * 0.021) * 2.4);
  ctx.lineTo(W, H + 2); ctx.lineTo(0, H + 2); ctx.closePath();
  for (i = 0; i < holes.length; i++){
    hl = holes[i];
    ctx.moveTo(hl.x + hl.rx, hl.y);
    ctx.ellipse(hl.x, hl.y, hl.rx, hl.ry, 0, 0, 6.283);
  }
  ctx.fillStyle = SOIL; ctx.fill('evenodd');
  for (i = 0; i < spx.length; i++){
    s = spx[i];
    ctx.fillStyle = s.c;
    ctx.beginPath(); ctx.ellipse(s.x, s.y, s.r, s.r * 0.7, 0, 0, 6.283); ctx.fill();
  }
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(70,50,30,.32)';
  for (i = 0; i < holes.length; i++){
    hl = holes[i];
    ctx.beginPath(); ctx.ellipse(hl.x, hl.y, hl.rx, hl.ry, 0, 0, 6.283); ctx.stroke();
  }
}

/* 土のひび。引くほど長く伸びる */
function drawCracks(hx, hy, hrx, p, seed){
  if (p < 0.04) return;
  var i, a, L;
  ctx.lineCap = 'round';
  for (i = 0; i < 7; i++){
    a = seed + i * 0.9 + Math.sin(i * 2.3 + seed) * 0.34;
    L = (9 + p * 36 * HR) * (0.5 + ((i * 7) % 5) / 5);
    ctx.beginPath();
    ctx.moveTo(hx + Math.cos(a) * hrx * 0.9, hy + Math.sin(a) * hrx * 0.42);
    ctx.lineTo(hx + Math.cos(a) * (hrx * 0.9 + L), hy + Math.sin(a) * (hrx * 0.42 + L * 0.42));
    ctx.lineWidth = Math.max(2, 3 * HR * (1 - i / 11));
    ctx.strokeStyle = 'rgba(64,45,27,' + (0.12 + p * 0.24) + ')';
    ctx.stroke();
  }
}

function drawClouds(t){
  var i, x, y, r;
  for (i = 0; i < 3; i++){
    x = ((t * (5 + i * 2) + i * 420) % (W + 260)) - 130;
    y = groundY * (0.2 + i * 0.22);
    r = (26 + i * 9) * HR;
    ctx.fillStyle = 'rgba(253,250,242,.62)';
    ctx.beginPath(); ctx.ellipse(x, y, r * 1.5, r * 0.62, 0, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x - r * 0.7, y + r * 0.12, r * 0.72, r * 0.5, 0, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + r * 0.62, y + r * 0.16, r * 0.62, r * 0.42, 0, 0, 6.283); ctx.fill();
  }
}

/* ---------- ループ ---------- */
var last = 0, autoPh = 0;

function frame(ms){
  var dt = last ? Math.min(0.05, (ms - last) / 1000) : 0.016;
  last = ms;
  var t = ms / 1000, i, j, p, hp, o, d2;

  /* --- 増える --- */
  growT += dt;
  if (growT > GROW_EVERY){ growT = 0; addPlant(); }

  /* --- 引きの量 --- */
  var effort = 0;
  for (i = 0; i < plants.length; i++){
    p = plants[i];
    p.grow = Math.min(1, p.grow + dt / 0.5);
    if (pulling && pulling.p === p){
      var d = Math.hypot(p.fx - p.x, p.fy - (groundY + p.dy - 18 * HR));
      var rd = clamp(d / pullDist(), 0, 1);
      /* 半分より深く引いたまま持っていると、そのぶんだけ土がゆるむ。
         指が動いていないのに勝手に伸びないよう、浅いところでは足さない */
      p.creep += dt * (rd > 0.5 ? 0.17 : 0);
      var raw = Math.min(1, rd + p.creep);
      var st = Math.floor(raw / 0.25);
      if (st > p.step){ p.step = st; sSoil(0.45); }
      var tgt = resist(raw);
      var a = (tgt - p.p) * 430 - p.pv * 34;
      p.pv += a * dt; p.p = clamp(p.p + p.pv * dt, 0, 1.08);
      if (pulling.voice) pulling.voice.update(p.p, p.sp);
      p.sp *= Math.exp(-dt * 6);
      if (raw >= 1){ popOut(p); i--; continue; }
      effort = Math.max(effort, p.p);
    } else {
      var b = (0 - p.p) * 170 - p.pv * 12;
      p.pv += b * dt; p.p += p.pv * dt;
      if (p.p < 0.002 && Math.abs(p.pv) < 0.02){ p.p = 0; p.pv = 0; }
      p.sway *= Math.exp(-dt * 2.0);
    }
  }

  /* --- 誘い。指示は届かない前提なので動きだけで誘う --- */
  var idle = (now() - lastInput) / 1000, stage = 0, auto = 0;
  if (!pulling && idle > 3 && plants.length){
    stage = idle < 8 ? 1 : (idle < 15 ? 2 : 3);
    demoT += dt;
    if (stage === 1 && demoT > 1.7){
      demoT = 0;
      plants[Math.floor(Math.random() * plants.length)].sway = 1;
      if (helpers.length){
        hp = helpers[Math.floor(Math.random() * helpers.length)];
        hp.hop = 10 * HR; hp.look = plants[0].x > hp.hx ? 1 : -1;
      }
    }
    if (stage === 2 && demoT > 1.3){
      demoT = 0;
      for (i = 0; i < plants.length; i++) plants[i].sway = 1.5;
      for (i = 0; i < helpers.length; i++) helpers[i].look = plants[0].x > helpers[i].hx ? 1 : -1;
      if (helpers.length) helpers[Math.floor(Math.random() * helpers.length)].hop = 15 * HR;
    }
    if (stage === 3){
      autoPh += dt;
      var q = autoPh % 4.2;
      auto = q < 1.7 ? 0.38 * Math.sin(q / 1.7 * Math.PI) : 0;
      if (q < dt * 2 && plants.length) plants[plants.length - 1].sway = 1;
    }
  } else { autoPh = 0; }

  var demoI = plants.length - 1;
  effortG = Math.max(effort, auto);

  /* --- 連れ。引きの量だけ後ろへ傾き、抜けた順に転がる --- */
  for (i = 0; i < helpers.length; i++){
    hp = helpers[i];
    var ht2 = leanDir * effortG * 0.46;
    if (hp.fallAt && t > hp.fallAt){
      if (!hp.rung){ hp.rung = true; ping(jit(294 * Math.pow(2, (i % 5) / 5)), 0.26, 'triangle', 0.13); }
      ht2 = leanDir * 1.22;
      if (t > hp.upAt){ ht2 = 0; if (Math.abs(hp.fall) < 0.04) hp.fallAt = 0; }
    }
    hp.fall += (ht2 - hp.fall) * Math.min(1, dt * (hp.fallAt ? 13 : 9));
    hp.hop *= Math.exp(-dt * 6);
    hp.look *= Math.exp(-dt * 0.7);
  }

  /* --- 飛んでいるやさい。着いたら層に焼き付けて残す --- */
  for (i = flying.length - 1; i >= 0; i--){
    o = flying[i];
    o.vy += 1750 * HR * dt;
    o.x += o.vx * dt; o.y += o.vy * dt; o.rot += o.rv * dt;
    o.x = clamp(o.x, 26 * HR, W - 26 * HR);
    if (o.y >= o.yr){
      o.y = o.yr;
      if (Math.abs(o.vy) > 150 * HR){
        o.vy *= -0.34; o.vx *= 0.12; o.rv *= 0.4;
        puff(o.x, o.y, 4, '#8a6a45', 0.6);
        ping(jit(o.k.freq * 0.5), 0.14, 'sine', 0.09);
      } else {
        land(o);
        flying.splice(i, 1);
      }
    }
  }

  /* --- 土煙 --- */
  for (i = dust.length - 1; i >= 0; i--){
    d2 = dust[i];
    d2.age += dt;
    if (d2.age > d2.life){ dust.splice(i, 1); continue; }
    d2.vy += 420 * HR * dt;
    d2.x += d2.vx * dt; d2.y += d2.vy * dt;
    d2.vx *= Math.exp(-dt * 1.8);
  }

  /* ---------- 描く ---------- */
  ctx.fillStyle = SKY; ctx.fillRect(0, 0, W, groundY + 2);
  drawClouds(t);

  /* 穴と、そこに見えている本体 */
  var holes = [];
  for (i = 0; i < plants.length; i++){
    p = plants[i];
    var shown = (i === demoI) ? Math.max(p.p, auto) : p.p;
    p.shown = shown;
    holes.push({
      x: p.x, y: groundY + p.dy + 3,
      rx: Math.max(16, p.k.wid * p.sc * 0.56), ry: (4 + shown * 20) * HR
    });
  }
  for (i = 0; i < holes.length; i++){
    ctx.fillStyle = '#4e3a24';
    ctx.beginPath(); ctx.ellipse(holes[i].x, holes[i].y, holes[i].rx, holes[i].ry, 0, 0, 6.283); ctx.fill();
  }
  for (i = 0; i < plants.length; i++){
    p = plants[i];
    var rise = p.shown * p.k.len * p.sc * 0.82;
    var bend = (pulling && pulling.p === p) ? (p.fx - p.x) * p.shown * 0.16 : 0;
    var tr = p.shown > 0.12 ? p.shown * 1.7 * HR : 0;
    ctx.save();
    ctx.translate(p.x + bend, groundY + p.dy - rise);
    ctx.rotate(clamp(bend / (140 * HR), -0.3, 0.3));
    drawBody(p.k, p.sc, tr, t, p.seed);
    ctx.restore();
  }

  drawSoil(holes);
  for (i = 0; i < plants.length; i++){
    p = plants[i];
    drawCracks(p.x, groundY + p.dy + 3, Math.max(16, p.k.wid * p.sc * 0.56), p.shown, p.seed);
  }

  /* 抜いたやさい。焼き付けた層をそのまま置く */
  if (layer) ctx.drawImage(layer, 0, 0, W, H);

  for (i = 0; i < flying.length; i++){
    o = flying[i];
    ctx.save();
    ctx.translate(o.x, o.y);
    ctx.rotate(o.rot);
    ctx.translate(0, -o.k.len * o.sc * 0.58 * 0.55);
    drawBody(o.k, o.sc * 0.58, 0, t, o.seed);
    drawLeaves(o.k, o.sc * 0.48, 4, 0, 0, t, o.seed, 0);
    ctx.restore();
  }

  /* 葉。土の上に出るので土より後に描く */
  for (i = 0; i < plants.length; i++){
    p = plants[i];
    var rise2 = p.shown * p.k.len * p.sc * 0.82;
    var held = pulling && pulling.p === p;
    var bend2 = held ? (p.fx - p.x) * p.shown * 0.16 : 0;
    var dir = 0;
    if (held) dir = clamp(Math.atan2(p.fx - p.x, (groundY + p.dy - rise2) - p.fy), -1.2, 1.2);
    var swy = p.sway * Math.sin(t * 7.5) * 0.24;
    ctx.save();
    ctx.translate(p.x + bend2, groundY + p.dy - rise2 + 2);
    ctx.rotate(clamp(bend2 / (140 * HR), -0.3, 0.3) + swy);
    ctx.scale(1, clamp(p.grow, 0.12, 1));
    drawLeaves(p.k, p.sc, 5, dir, p.shown, t, p.seed, p.shown > 0.12 ? p.shown * 1.4 * HR : 0);
    ctx.restore();
  }

  for (i = 0; i < helpers.length; i++) drawHelper(helpers[i], t, effortG);

  for (i = 0; i < dust.length; i++){
    d2 = dust[i];
    ctx.globalAlpha = clamp(1 - d2.age / d2.life, 0, 1) * 0.85;
    ctx.fillStyle = d2.col;
    ctx.beginPath(); ctx.ellipse(d2.x, d2.y, d2.r, d2.r * 0.86, 0, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;

  requestAnimationFrame(frame);
}

/* 中の値を外から読むための窓。tools/check_nukeru.js が数えるために使う */
window.__probe = function(){
  var p = pulling ? pulling.p : (plants.length ? plants[plants.length - 1] : null);
  return {
    n: helpers.length, pull: effortG, kind: p ? p.k.id : '', loose: pile.length + flying.length,
    x: p ? p.x : 0, gy: groundY + (p ? p.dy : 0), plants: plants.length, lanes: slotCount(),
    xs: plants.map(function(q){ return Math.round(q.x); }),
    kinds: plants.map(function(q){ return q.k.id; }),
    fall: helpers.map(function(h){ return h.fall; })
  };
};

/* ---------- 起動 ---------- */
resize();
LANES = laneCount();
addPlant(Math.floor(LANES / 2));
addPlant(LANES + Math.max(0, Math.floor(LANES / 2) - 1));
helpers.push(makeHelper());
layoutHelpers();
requestAnimationFrame(frame);

})();
</script>
