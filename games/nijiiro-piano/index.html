<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f7f2e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>にじいろピアノ</title>
<style>
  :root{ color-scheme: light; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    width:100%; height:100%; overflow:hidden;
    background:#f7f2e8;
    overscroll-behavior:none; touch-action:none;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
    font-family: system-ui, -apple-system, "Segoe UI",
      "Hiragino Kaku Gothic ProN", "Hiragino Sans",
      "BIZ UDPGothic", "Yu Gothic Medium", "Yu Gothic", YuGothic,
      Meiryo, "Noto Sans JP", sans-serif;
  }
  #pads{
    position:fixed; inset:0;
    display:grid; gap:7px; padding:7px;
    padding-top:max(7px, env(safe-area-inset-top));
    padding-bottom:max(7px, env(safe-area-inset-bottom));
    grid-template-columns:repeat(2,1fr);
    grid-template-rows:repeat(4,1fr);
  }
  @media (orientation:landscape){
    #pads{ grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(2,1fr); }
  }
  .pad{
    position:relative; overflow:hidden;
    border:0; border-radius:20px; padding:0;
    display:grid; place-items:center;
    touch-action:none; cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:transform .12s ease-out, filter .12s ease-out;
    will-change:transform;
  }
  .pad svg{ width:46%; height:46%; max-width:130px; max-height:130px; display:block; opacity:.92; }
  .pad svg *{ fill:#fff; }
  .pad.on{ transform:scale(.955); filter:brightness(1.14) saturate(1.05); }
  .rip{
    position:absolute; left:0; top:0; width:26px; height:26px;
    margin:-13px 0 0 -13px; border-radius:50%;
    border:3px solid rgba(255,255,255,.92);
    pointer-events:none;
    animation:rip .62s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes rip{
    from{ transform:scale(.4); opacity:.95; }
    to  { transform:scale(11); opacity:0; }
  }
  #home{
    position:fixed; top:max(12px, env(safe-area-inset-top)); left:max(12px, env(safe-area-inset-left));
    width:40px; height:40px; padding:0; border:0; border-radius:50%;
    background:rgba(255,255,255,.4);
    display:grid; place-items:center; cursor:pointer; z-index:5;
    touch-action:none; -webkit-tap-highlight-color:transparent;
  }
  #home svg{ width:34px; height:34px; display:block; }
  #home .trk{ fill:none; stroke:rgba(60,58,54,.25); stroke-width:2.5; }
  #home .rng{
    fill:none; stroke:#3c3a36; stroke-width:2.5; stroke-linecap:round;
    stroke-dasharray:94.2; stroke-dashoffset:94.2;
    transform:rotate(-90deg); transform-origin:50% 50%;
    transition:stroke-dashoffset .04s linear;
  }
  #home.hold .rng{ stroke-dashoffset:0; transition:stroke-dashoffset .7s linear; }
  #home .ico{ fill:#3c3a36; opacity:.7; stroke:none; }
</style>
</head>
<body>
<div id="pads"></div>
<button id="home" aria-label="おもちゃばこに もどる">
  <svg viewBox="0 0 36 36" aria-hidden="true">
    <circle class="trk" cx="18" cy="18" r="15"/>
    <circle class="rng" cx="18" cy="18" r="15"/>
    <path class="ico" d="M18 9.4 10.2 16v9.1c0 .6.5 1.1 1.1 1.1h4.1v-5.3h5.2v5.3h4.1c.6 0 1.1-.5 1.1-1.1V16z"/>
  </svg>
</button>
<script>
(function(){
'use strict';

var SHAPES = {
  maru:  '<circle cx="50" cy="50" r="31"/>',
  shika: '<rect x="21" y="21" width="58" height="58" rx="13"/>',
  sank:  '<polygon points="50,17 82,78 18,78"/>',
  hoshi: '<polygon points="50,17 57.8,39.3 81.4,39.8 62.6,54.1 69.4,76.7 50,63.2 30.6,76.7 37.5,54.1 18.6,39.8 42.2,39.3"/>',
  heart: '<path d="M50 82C20 60 14 38 28 28c11-8 20-1 22 6 2-7 11-14 22-6 14 10 8 32-22 54z"/>',
  hana:  '<circle cx="50" cy="28" r="15"/><circle cx="69" cy="39" r="15"/><circle cx="69" cy="61" r="15"/>' +
         '<circle cx="50" cy="72" r="15"/><circle cx="31" cy="61" r="15"/><circle cx="31" cy="39" r="15"/>' +
         '<circle cx="50" cy="50" r="14"/>',
  shizu: '<path d="M50 15c18 25 28 39 28 49a28 28 0 0 1-56 0c0-10 10-24 28-49z"/>',
  kumo:  '<circle cx="35" cy="58" r="16"/><circle cx="52" cy="47" r="21"/><circle cx="69" cy="58" r="15"/>' +
         '<rect x="33" y="57" width="38" height="17" rx="8.5"/>'
};

var PADS = [
  { c:'#ee6c6c', s:'maru',  f:261.63 },
  { c:'#f39c4a', s:'hoshi', f:293.66 },
  { c:'#f2c94c', s:'sank',  f:329.63 },
  { c:'#9ac96a', s:'heart', f:392.00 },
  { c:'#4fb896', s:'hana',  f:440.00 },
  { c:'#4fabc4', s:'shika', f:523.25 },
  { c:'#6a9fe0', s:'shizu', f:587.33 },
  { c:'#e88fb4', s:'kumo',  f:659.25 }
];

/* ---------- 音 ---------- */
var ac = null, master = null, dly = null, voices = 0;

function audio(){
  if (ac){ if (ac.state === 'suspended') ac.resume(); return ac; }
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  try { ac = new AC(); } catch(e){ return null; }
  var comp = ac.createDynamicsCompressor();
  comp.threshold.value = -15; comp.knee.value = 24; comp.ratio.value = 10;
  comp.attack.value = 0.004; comp.release.value = 0.25;
  master = ac.createGain(); master.gain.value = 0.42;
  master.connect(comp); comp.connect(ac.destination);
  var d = ac.createDelay(1.0); d.delayTime.value = 0.27;
  var fb = ac.createGain(); fb.gain.value = 0.24;
  var wet = ac.createGain(); wet.gain.value = 0.20;
  var hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 500;
  d.connect(fb); fb.connect(d); d.connect(hp); hp.connect(wet); wet.connect(master);
  dly = ac.createGain(); dly.gain.value = 1; dly.connect(d);
  return ac;
}

function note(f){
  var a = audio(); if (!a) return;
  if (voices > 12) return;
  voices++;
  var t = a.currentTime;
  var g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.30, t + 0.014);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 1.5);
  var lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 0.6;
  lp.frequency.setValueAtTime(Math.min(16000, f * 7), t);
  lp.frequency.exponentialRampToValueAtTime(Math.max(200, f * 1.8), t + 1.2);
  var o1 = a.createOscillator(); o1.type = 'sine';     o1.frequency.value = f;
  var o2 = a.createOscillator(); o2.type = 'triangle'; o2.frequency.value = f * 2.004;
  var o3 = a.createOscillator(); o3.type = 'sine';     o3.frequency.value = f * 0.5;
  var g2 = a.createGain(); g2.gain.value = 0.26;
  var g3 = a.createGain(); g3.gain.value = 0.18;
  o1.connect(lp); o2.connect(g2); g2.connect(lp); o3.connect(g3); g3.connect(lp);
  lp.connect(g); g.connect(master); g.connect(dly);
  o1.start(t); o2.start(t); o3.start(t);
  o1.stop(t + 1.6); o2.stop(t + 1.6); o3.stop(t + 1.6);
  o1.onended = function(){ voices--; };
}

/* ---------- 画面 ---------- */
var wrap = document.getElementById('pads');

PADS.forEach(function(p){
  var el = document.createElement('button');
  el.className = 'pad';
  el.style.background = p.c;
  el.setAttribute('aria-label', 'おと');
  el.innerHTML = '<svg viewBox="0 0 100 100" aria-hidden="true">' + SHAPES[p.s] + '</svg>';

  el.addEventListener('pointerdown', function(e){
    e.preventDefault();
    note(p.f);
    el.classList.add('on');
    var r = el.getBoundingClientRect();
    var s = document.createElement('span');
    s.className = 'rip';
    s.style.left = (e.clientX - r.left) + 'px';
    s.style.top  = (e.clientY - r.top)  + 'px';
    el.appendChild(s);
    s.addEventListener('animationend', function(){ if (s.parentNode) s.parentNode.removeChild(s); });
    setTimeout(function(){ el.classList.remove('on'); }, 130);
  }, { passive: false });

  el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  wrap.appendChild(el);
});

/* ---------- もどる（700ms 長押し） ---------- */
var home = document.getElementById('home'), ht = null;
home.addEventListener('pointerdown', function(e){
  e.preventDefault(); e.stopPropagation();
  home.classList.add('hold');
  ht = setTimeout(function(){ location.href = '../../'; }, 700);
}, { passive: false });
['pointerup','pointerleave','pointercancel'].forEach(function(k){
  home.addEventListener(k, function(e){
    e.stopPropagation();
    home.classList.remove('hold');
    if (ht){ clearTimeout(ht); ht = null; }
  });
});
})();
</script>
</body>
</html>
