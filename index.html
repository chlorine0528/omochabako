<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>おもちゃばこ</title>
<meta name="theme-color" content="#fbf7ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1b1e" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="おもちゃばこ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex,nofollow">
<style>
  :root{
    color-scheme: light dark;
    --bg:#fbf7ef; --panel:#fffdf8; --line:#e6ddcd;
    --ink:#33312c; --sub:#7c766a; --accent:#c96a4e;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1a1b1e; --panel:#232428; --line:#34363b;
      --ink:#eae7e0; --sub:#9d9a93; --accent:#e8956f;
    }
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    min-height:100dvh; background:var(--bg); color:var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI",
      "Hiragino Kaku Gothic ProN", "Hiragino Sans",
      "BIZ UDPGothic", "Yu Gothic Medium", "Yu Gothic", YuGothic,
      Meiryo, "Noto Sans JP", sans-serif;
    font-size:15px; line-height:1.85; letter-spacing:.03em;
    line-break:strict;
    -webkit-tap-highlight-color:transparent;
    padding:
      max(20px, env(safe-area-inset-top))
      max(16px, env(safe-area-inset-right))
      max(28px, env(safe-area-inset-bottom))
      max(16px, env(safe-area-inset-left));
  }
  .wrap{ max-width:640px; margin:0 auto; }

  header{ padding:6px 4px 22px; }
  h1{
    font-size:27px; font-weight:700; line-height:1.35; letter-spacing:.04em;
    font-feature-settings:"palt" 1;
  }
  .lede{ margin-top:6px; color:var(--sub); font-size:13.5px; line-height:1.8; }

  .grid{
    display:grid; gap:14px;
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
  @media (min-width:560px){ .grid{ grid-template-columns:repeat(3,minmax(0,1fr)); } }

  .card{
    display:flex; flex-direction:column; gap:8px;
    text-decoration:none; color:inherit;
    transition:transform .14s ease-out;
  }
  .card:active{ transform:scale(.972); }
  .tile{
    position:relative; display:grid; place-items:center;
    aspect-ratio:1/1; border-radius:20px;
    border:1px solid var(--line); overflow:hidden;
  }
  .tile svg{ width:74%; height:74%; display:block; }
  .badge{
    position:absolute; top:9px; right:9px;
    background:var(--accent); color:#fffdf8;
    font-size:10.5px; font-weight:700; letter-spacing:.06em;
    line-height:1; padding:5px 8px; border-radius:999px;
  }
  .name{
    font-size:16px; font-weight:700; line-height:1.5; letter-spacing:.05em;
    padding:0 2px;
  }
  .when{
    font-size:11.5px; color:var(--sub); line-height:1.5;
    letter-spacing:.02em; padding:0 2px;
    font-variant-numeric:tabular-nums;
  }

  .note{
    margin-top:34px; padding:16px 18px;
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    font-size:13px; line-height:1.9; color:var(--sub);
  }
  .note p + p{ margin-top:9px; }
  .note b{ color:var(--ink); font-weight:700; }
  footer{
    margin-top:18px; padding:0 4px;
    font-size:11.5px; color:var(--sub); letter-spacing:.02em;
    font-variant-numeric:tabular-nums;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>おもちゃばこ</h1>
    <p class="lede">すきな えを おしてね</p>
  </header>

  <nav class="grid">
      <a class="card" href="games/nijiiro-piano/">
        <span class="tile" style="background:#f7f2e8"><svg viewBox="0 0 120 120" aria-hidden="true"><rect x="14" y="14" width="42" height="42" rx="11" fill="#ee6c6c"/><rect x="64" y="14" width="42" height="42" rx="11" fill="#f2c94c"/><rect x="14" y="64" width="42" height="42" rx="11" fill="#4fb896"/><rect x="64" y="64" width="42" height="42" rx="11" fill="#6a9fe0"/><circle cx="35" cy="35" r="11" fill="rgba(255,255,255,.9)"/><polygon points="85,24 89,34 100,34 91,41 94,52 85,45 76,52 79,41 70,34 81,34" fill="rgba(255,255,255,.9)"/><path d="M35 96C25 89 22 82 27 79c4-2 7 0 8 3 1-3 4-5 8-3 5 3 2 10-8 17z" fill="rgba(255,255,255,.9)"/><rect x="74" y="74" width="22" height="22" rx="6" fill="rgba(255,255,255,.9)"/></svg><span class="badge">あたらしい</span></span>
        <span class="name">にじいろピアノ</span>
        <time class="when" datetime="2026-08-08">2026年8月8日（土）</time>
      </a>
      <a class="card" href="games/shabondama/">
        <span class="tile" style="background:#d8ebe6"><svg viewBox="0 0 120 120" aria-hidden="true"><defs><radialGradient id="b1" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fffdf6"/><stop offset=".55" stop-color="#bfe6dd"/><stop offset="1" stop-color="#8fd0e0"/></radialGradient><radialGradient id="b2" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fffaf0"/><stop offset=".55" stop-color="#f6d9a8"/><stop offset="1" stop-color="#eab7c4"/></radialGradient><radialGradient id="b3" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fefdf7"/><stop offset=".55" stop-color="#cfe3b4"/><stop offset="1" stop-color="#9fd3b8"/></radialGradient></defs><circle cx="44" cy="48" r="31" fill="url(#b1)"/><circle cx="84" cy="36" r="19" fill="url(#b2)"/><circle cx="76" cy="82" r="25" fill="url(#b3)"/><ellipse cx="33" cy="36" rx="7" ry="4.6" fill="#fff" opacity=".9" transform="rotate(-32 33 36)"/><ellipse cx="78" cy="29" rx="4.4" ry="2.9" fill="#fff" opacity=".9" transform="rotate(-32 78 29)"/><ellipse cx="67" cy="73" rx="5.6" ry="3.7" fill="#fff" opacity=".9" transform="rotate(-32 67 73)"/></svg></span>
        <span class="name">しゃぼんだま</span>
        <time class="when" datetime="2026-08-08">2026年8月8日（土）</time>
      </a>
  </nav>

  <div class="note">
    <p><b>音が出ないとき</b>はスマホのマナーモードを解除してください。画面を1回タップしてから鳴りはじめます。</p>
    <p><b>ホーム画面に追加</b>しておくと、このページからすぐ開けます。共有ボタン（□に↑）から追加できます。</p>
    <p>ゲームの中の<b>左上の小さいボタンを1秒ほど長押し</b>すると、ここに戻ります。短く押しただけでは戻らないので、遊んでいる最中に間違って抜けることはありません。</p>
  </div>

  <footer>ぜんぶで 2こ ／ 最終更新 2026-08-08</footer>
</div>
</body>
</html>
